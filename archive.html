<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Singularity Pulse — Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --accent: #c2410c;
    --rule: #e5e5e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #f0f0ec;
      --muted: #9a9a96;
      --accent: #fb923c;
      --rule: #2a2a28;
    }
  }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .nav-row {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .nav-row a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 800;
    font-size: 38px;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  .sub {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 32px;
  }
  .issue {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: var(--fg);
    transition: padding 0.15s ease;
  }
  .issue:hover {
    padding-left: 8px;
    color: var(--accent);
  }
  .issue .date {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 13px;
    flex-shrink: 0;
    margin-left: 16px;
  }
  .issue .headline {
    font-size: 16px;
    font-weight: 500;
  }
  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 40px 0;
    text-align: center;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
</style>
</head>
<body>
<div class="container">
<div class="nav-row"><a href="./">← today</a></div>
<h1>Archive</h1>
<p class="sub">Every past issue of Singularity Pulse.</p>

<div id="issues">
<a class="issue" href="2026-05-12.html">
  <span class="headline">Project Glasswing and the cybersecurity asymmetry flip</span>
  <span class="date">2026-05-12</span>
</a>
</div>

</div>
</body>
</html>
